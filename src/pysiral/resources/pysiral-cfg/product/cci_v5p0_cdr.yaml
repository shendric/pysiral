config:
  pysiral_version: ">=0.14"


attributes:
    product_line: "cci"
    record_type: "cdr"
    version: "v5p0"
    platforms: &platforms ["ers2", "envisat", "cryosat2", "sentinel3a", "sentinel3b"]

dynamic_variables:

  l3_grid:  # -> l3_grid[HEMISPHERE] -> variable L3_GRID
    nh: "nh25kmEASE2"
    sh: "sh25kmEASE2"

  doi_l2p: # -> doi_l2p[HEMISPHERE] -> variable DOI_L2P
    nh: ""
    sh: ""

  doi_l3s: # -> doi_l3s[HEMISPHERE] -> variable DOI_L3S
    nh: ""
    sh: ""

  l1p_settings:  # -> l1p_settings[PLATFORM] -> variable L1P_SETTINGS
    ers1: "ers_fdr4alt_v1p0"
    ers2: "ers_fdr4alt_v1p0"
    envisat: "envisat_fdr4alt_v1p0"
    cryosat2: "cryosat2_pds_ipf1e_v1p2"
    sentinel3a: "sentinel3a_l2lan_v1p2"
    sentinel3b: "sentinel3b_l2lan_v1p2"

  source_dataset_id:  # -> source_dataset_id[PLATFORM] -> variable SOURCE_DATASET_ID
    ers1: "fdr4alt"
    ers2: "fdr4alt"
    envisat: "fdr4alt"
    cryosat2: "baseline_e"
    sentinel3a: "l2_lan_si_rep"
    sentinel3b: "l2_lan_si_b005"

  l1p_version:  # -> l1p_version[PLATFORM] -> variable L1P_VERSION
    ers1: "fdr4alt:v1p0"
    ers2: "fdr4alt:v1p0"
    envisat: "fdr4alt:v1p0"
    cryosat2: "pds_ipf1e:v1p2"
    sentinel3a: "l2kan:v1p2"
    sentinel3b: "l2lan:v1p2"

  mission:
    ers1: "ers"
    ers2: "ers"
    envisat: "envisat"
    cryosat2: "cryosat"
    sentinel3a: "sentinel3"
    sentinel3b: "sentinel3"

processors:

  l1:
    l1p_settings: "{l1p_settings[platform]}"
    hemisphere: "{hemisphere}"
    platform: "{platform}"

  l2:
    l1p_version: "{l1p_version[platform]}"
    l2_settings: "cci_{mission[platform]}_{hemisphere}_v5p0_cdr"
    l2_outputs: ["l2i_cci_v5p0"]
    source_dataset_id: "{source_dataset_id[platform]}"
    platform: "{platform}"

  l2p: {}

  l3:
    l3_settings: "l3_cci_v5p0"
    platform: *platforms
    grid_id: "{l3_grid[hemisphere]}"
    period: "P1M"
    doi: "{doi_l3s[hemisphere]}"
    l3_output: ["l3_cci_v5p0", "l3_cci_v5p0-internal"]
