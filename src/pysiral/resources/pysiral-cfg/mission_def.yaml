# Definition file of supported radar altimeter missions in pysiral
---

# -----------------------------------------------------------------------------
# Definition for each mission
# (the tag name has to be identical to the one in the mission list)
# -----------------------------------------------------------------------------

missions:

    - id: ers
      name: ERS

    - id: cryosat
      name: CryoSat

    - id: envisat
      name: Envisat

    - id: sentinel3
      name: Sentinel-3


platforms: 

    - id: ers1
      name: ERS-1
      mission: ers
      sensor: RA
      time_coverage:
          start: 1991-08-03T00:00:00.00
