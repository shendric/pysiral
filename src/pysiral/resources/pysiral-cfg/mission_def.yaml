      orbit_max_latitude: 81.48

    - id: ers2
      name: ERS-2
      mission: ers
      sensor: RA
      time_coverage:
          start: 1995-05-14T00:00:00.00
          end: 2003-07-02T23:59:59.99
      orbit_max_latitude: 81.48

    - id: cryosat2
      name: CryoSat-2
      mission: cryosat
      sensor: SIRAL
      time_coverage:
          start: 2010-07-17T00:00:00.00
